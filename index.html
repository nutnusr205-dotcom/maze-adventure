<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a83d5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="迷宮大冒險"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>迷宮大冒險｜特教友善遊戲</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#153454}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#65d2ff,#c9f3ff 55%,#b2eb87);min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;border:2px solid #fff;border-radius:17px;background:#fff;color:#11457d;font-weight:850;padding:10px 15px;box-shadow:0 3px 0 #7ab3d0}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #ffab00}button.primary{background:linear-gradient(#37e781,#06a650);color:white;font-size:1.25rem}button.orange{background:#ff9b24;color:white}button.blue{background:#1679e4;color:white}button:disabled{opacity:.45;cursor:not-allowed}header{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}header h1{font-size:clamp(19px,3vw,29px);margin:0 auto 0 0;color:#07528d;text-shadow:1px 2px white}.pill{background:#126bc1;color:white;border:3px solid white;border-radius:30px;padding:8px 14px;font-weight:850}#layout{display:grid;grid-template-columns:210px minmax(0,1fr) 265px;gap:12px;padding:6px 12px 12px;max-width:1700px;margin:auto}#layout.playing{grid-template-columns:minmax(0,1fr)}#layout.playing #left,#layout.playing #settings{display:none}.panel{background:#f4fbffed;border:3px solid #fff;border-radius:23px;padding:14px;box-shadow:0 6px 18px #1e83ae30}.panel h2{margin:2px 0 12px;font-size:1.15rem;color:#1160ad}#left{display:flex;flex-direction:column;gap:10px}#left button{width:100%}#stage{min-width:0;display:flex;flex-direction:column;gap:9px}#boardWrap{position:relative;margin:auto;width:min(100%,1100px);background:#278e27;border:7px solid white;border-radius:22px;overflow:hidden;box-shadow:0 8px 0 #459e6a}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}#status{position:absolute;left:10px;top:10px;background:#ffffffed;padding:7px 12px;border-radius:15px;font-weight:800;pointer-events:none}#controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}#dpad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,55px);gap:5px;align-items:center;justify-items:center}#dpad button{width:62px;height:55px;font-size:28px;padding:0;background:#147bfa;color:white;touch-action:none}#dpad .up{grid-column:2}#dpad .left{grid-column:1;grid-row:2}#dpad .down{grid-column:2;grid-row:2}#dpad .right{grid-column:3;grid-row:2}#settings label{display:block;font-weight:750;margin:10px 0 4px}#settings select,#settings input[type=number]{width:100%;padding:9px;border:2px solid #90badd;border-radius:10px;background:white}#settings input[type=checkbox]{width:21px;height:21px;vertical-align:middle}#settings .check{display:flex;align-items:center;gap:8px}#settings .check label{margin:6px 0}#settings button{margin-top:9px;width:100%}footer{text-align:center;padding:9px 10px;background:#086f56;color:white;font-size:clamp(14px,2vw,18px);font-weight:700;letter-spacing:.4px}#dialog{position:fixed;inset:0;background:#003b5f99;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}#dialog.show{display:flex}#dialog article{max-width:440px;width:100%;background:white;border-radius:24px;padding:24px;text-align:center;box-shadow:0 12px 40px #1238}#dialog h2{font-size:2rem;margin:0 0 10px}#dialog button{margin:6px}#update{display:none;position:fixed;bottom:55px;left:50%;transform:translateX(-50%);z-index:11;background:white;border:3px solid #0674b4;border-radius:20px;padding:12px;box-shadow:0 5px 20px #3336}#update.show{display:block}.hint{font-size:.88rem;color:#47637a;line-height:1.55}#settingsToggle{display:none}#characterPicker{width:100%;padding:10px;border-radius:12px;border:2px solid #94b6da;background:white}#levelPicker{width:100%;padding:10px;border-radius:12px;border:2px solid #94b6da}#toast{min-height:26px;text-align:center;font-weight:800;color:#15568b}@media(max-width:1050px){#layout{grid-template-columns:160px minmax(0,1fr) 225px;gap:6px;padding:6px}#left,#settings{padding:9px}#controls button{padding:8px}}@media(max-width:760px){#layout:not(.playing){display:flex;flex-direction:column}#left{display:grid;grid-template-columns:repeat(2,1fr)}#left h2{grid-column:1/-1}#layout.playing{display:block}#settingsToggle{display:inline-block}#dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px)}#dpad button{width:54px;height:48px}header{gap:5px;padding:6px}header .pill{padding:5px 8px;font-size:.85rem}#boardWrap{border-width:4px}#status{font-size:.8rem}#controls{gap:5px}}@media(max-height:650px) and (orientation:landscape){header{padding:3px 8px}#layout{padding:2px 8px}#boardWrap{max-width:min(90vw,1000px)}footer{padding:4px}}
</style></head><body><header><h1>🌟 迷宮大冒險</h1><span class="pill" id="levelTitle">第 1 關</span><span class="pill" id="progress">完成 0 / 15</span><span class="pill" id="hearts">❤️❤️❤️</span><button id="homeBtn" title="返回選單">🏠</button><button id="settingsToggle" title="老師設定">⚙️</button><button id="soundBtn" title="切換音效">🔊</button><button id="fullBtn" title="全螢幕">⛶</button></header><main id="layout"><aside id="left" class="panel"><h2>🎮 遊戲選單</h2><label for="characterPicker"><strong>選擇人物</strong></label><select id="characterPicker"><option value="🧒">🧒 小男孩</option><option value="👧">👧 小女孩</option><option value="🐰">🐰 小兔子</option><option value="🐻">🐻 小熊</option><option value="🐱">🐱 小貓</option><option value="🦖">🦖 小恐龍</option></select><button id="startBtn" class="primary">▶ 開始遊戲</button><label for="levelPicker"><strong>選擇關卡</strong></label><select id="levelPicker"></select><button id="recordsBtn">🏆 我的紀錄</button><button id="helpBtn">📖 操作說明</button><button id="aboutBtn">ℹ️ 關於遊戲</button><p class="hint">先選關卡及老師設定，再按開始遊戲。每一關都可以重新挑戰。</p></aside><section id="stage"><div id="boardWrap"><canvas id="maze" width="960" height="600" aria-label="迷宮遊戲畫面"></canvas><div id="status">找到 ⭐ 終點！</div></div><div id="toast" aria-live="polite"></div><div id="controls"><div id="dpad"><button class="up" data-dir="0,-1" aria-label="向上">▲</button><button class="left" data-dir="-1,0" aria-label="向左">◀</button><button class="down" data-dir="0,1" aria-label="向下">▼</button><button class="right" data-dir="1,0" aria-label="向右">▶</button></div><button id="restartBtn" class="orange">↻ 重新開始</button><button id="nextBtn" class="blue" disabled>下一關 ➜</button><button id="pauseBtn">⏸ 暫停</button></div></section><aside id="settings" class="panel"><h2>⚙️ 老師設定</h2><label for="mode">操作模式</label><select id="mode"><option value="keys">方向鍵（畫面／實體鍵盤）</option><option value="drag">手指拖曳</option><option value="mouse">滑鼠游標跟隨</option></select><label for="keyStyle">方向鍵移動方式</label><select id="keyStyle"><option value="continuous">按住連續移動</option><option value="step">按一下移動一格</option></select><label for="speed">人物移動速度</label><select id="speed"><option value="slow">慢速</option><option value="medium">中速</option><option value="fast">快速</option></select><label for="ghostCount">鬼怪數量（0～10 隻）</label><input type="number" id="ghostCount" min="0" max="10" step="1"><label for="ghostSpeed">鬼怪移動速度</label><select id="ghostSpeed"><option value="slow">慢速</option><option value="medium">中速</option><option value="fast">快速</option></select><label for="collision">碰到鬼怪時</label><select id="collision"><option value="stay">原地暫停（短暫保護）</option><option value="return">回到起點</option><option value="life">扣除一顆愛心</option></select><div class="check"><input type="checkbox" id="hints"><label for="hints">顯示路線提示</label></div><div class="check"><input type="checkbox" id="sound"><label for="sound">遊戲音效與鼓勵語音</label></div><button id="saveBtn" class="blue">💾 儲存設定</button><button id="defaultsBtn">↺ 恢復預設</button><button id="closeSettingsBtn">關閉設定</button><p class="hint">遊戲進行中開啟設定會暫停遊戲。設定只儲存在目前使用的裝置。</p></aside></main><footer>國立臺南大學特教系 臧永佳 AI設計開發</footer><div id="dialog" role="dialog" aria-modal="true"><article><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="dialogActions"></div></article></div><div id="update">發現新版遊戲！ <button id="updateBtn" class="blue">立即更新</button></div><script src="app.js" defer></script></body></html>
